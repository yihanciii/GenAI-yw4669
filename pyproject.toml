[project]
name = "sps-genai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "en-core-web-md",
    "fastapi[standard]>=0.141.1",
    "pillow>=11.0.0",
    "spacy>=3.8.16",
    # Intel Macs: PyTorch 2.2.2 is the last version with Intel Mac support
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Everything else (Apple Silicon, Linux/Docker, Windows)
    "torch>=2.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision>=0.23.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
# Inside Docker (Linux) use the small CPU-only PyTorch build
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
